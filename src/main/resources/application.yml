spring:
    application:
        name: blogging-api
    datasource:
        url: jdbc:postgresql://localhost:5432/blogging_app
        driver-class-name: org.postgresql.Driver
    jpa:
        hibernate:
            ddl-auto: create
        properties:
            hibernate:
                "[format_sql]": false
        show-sql: true
        open-in-view: false
        defer-datasource-initialization: true
    sql:
        init:
            mode: never # coba: 'always' jika data.sql sudah di isi
    profiles:
        active: local
    

jwt:
    expiration: 86400000
    refresh-expiration: 604800000


